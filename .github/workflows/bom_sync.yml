name: Scheduled BOM & Stock Sync Bot

on:
  schedule:
    # Run automatically every 3 minutes from 8:00 AM to 8:00 PM BST (2:00 UTC to 14:00 UTC)
    - cron: '*/3 2-14 * * *'
  workflow_dispatch: # Allows manual one-click trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Install Dependencies
        run: |
          python -m pip install --upgrade pip

      - name: 🤖 Run Headless BOM & Warehouse Stock Sync Bot
        env:
          ERP_UID: ${{ secrets.ERP_UID }}
          ERP_PASS: ${{ secrets.ERP_PASS }}
          ERP_CID: ${{ secrets.ERP_CID }}
          ERP_DB: ${{ secrets.ERP_DB }}
          ERP_LOGIN_URL: ${{ secrets.ERP_LOGIN_URL }}
        run: |
          python bot.py --sync

      - name: 💾 Commit and Push Updated Datasets to GitHub
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if ! git diff --quiet data/ || ! git diff --staged --quiet data/; then
            git commit -m "🤖 Auto-Sync: Updated BOMs & Warehouse Stock [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No changes in data files to commit."
          fi
